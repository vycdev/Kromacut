<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="manual-title manual-desc"><title id="manual-title" data-i18n="title">A row is a thickness, not a top height</title><desc id="manual-desc" data-i18n="description">Three columns stop at the black, red, and white surfaces; their heights add upward from a common plate.</desc><rect width="960" height="480" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700" data-i18n="aRowIsAThicknessNotATop">A row is a thickness, not a top height</text><rect x="24" y="78" width="460" height="332" rx="12" fill="#1b2736" stroke="none"/><rect x="500" y="78" width="436" height="332" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="110" fill="#38bdf8" font-size="21" font-weight="700" data-i18n="sideViewCumulativeStack">Side view: cumulative stack</text><rect x="64" y="250" width="360" height="85" rx="0" fill="#344155" stroke="none"/><rect x="184" y="184" width="240" height="66" rx="0" fill="#cf7254" stroke="none"/><rect x="304" y="150" width="120" height="34" rx="0" fill="#eef3f8" stroke="none"/><line x1="44" y1="338" x2="455" y2="338" stroke="#b3c2d4" stroke-width="4"/><text x="75" y="305" fill="#f1f5f9" font-size="18" font-weight="600" data-i18n="black">Black</text><text x="225" y="224" fill="#121923" font-size="18" font-weight="600" data-i18n="red">Red</text><text x="337" y="174" fill="#121923" font-size="18" font-weight="600" data-i18n="white">White</text><text x="51" y="378" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="plateBlackRedWhite">Plate → black → red → white</text><text x="520" y="110" fill="#fbbf24" font-size="21" font-weight="700" data-i18n="exampleAt008MmLayers">Example at 0.08 mm layers</text><text x="520" y="153" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="runThickness">Run thickness</text><text x="764" y="153" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="topHeight">Top height</text><text x="520" y="198" fill="#f1f5f9" font-size="18" data-i18n="black020Mm">Black: 0.20 mm</text><text x="728" y="198" fill="#38bdf8" font-size="18">→</text><text x="764" y="198" fill="#f1f5f9" font-size="18">0.20 mm</text><text x="520" y="241" fill="#f1f5f9" font-size="18" data-i18n="red016Mm">Red: 0.16 mm</text><text x="728" y="241" fill="#38bdf8" font-size="18">→</text><text x="764" y="241" fill="#f1f5f9" font-size="18">0.36 mm</text><text x="520" y="284" fill="#f1f5f9" font-size="18" data-i18n="white008Mm">White: 0.08 mm</text><text x="728" y="284" fill="#38bdf8" font-size="18">→</text><text x="764" y="284" fill="#f1f5f9" font-size="18">0.44 mm</text><text x="520" y="335" fill="#38bdf8" font-size="18" font-weight="400" data-i18n="firstLayer020Mm">First layer: 0.20 mm</text><text x="520" y="373" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="laterSurfacesIncludeEarlierRuns">Later surfaces include earlier runs.</text><text x="28" y="446" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="schematicIncreasingALowerRunLiftsLaterSurfaces">Schematic. Increasing a lower run lifts later surfaces and moves later swaps.</text></g></svg>
