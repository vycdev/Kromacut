<title id="swatch-title" data-i18n="title">Recolor, remove, or remap?</title><desc id="swatch-desc" data-i18n="description">Three schematic images compare applying a new color, applying zero alpha, and deleting a swatch. Delete maps to the remaining palette rather than making transparent holes.</desc>
