<text x="264.0" y="435.9" font-size="12" fill="#a1a1aa" text-anchor="middle" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >unclaimed</text>
<rect x="346.0" y="102.0" width="430.0" height="370.0" fill="#27272a" stroke="#52525b" stroke-width="1.5" rx="8" />
<text x="561.0" y="128.0" font-size="14" fill="#e4e4e7" text-anchor="middle" font-weight="bold" font-family="Inter,ui-sans-serif,sans-serif" >How it works</text>
<text x="364.0" y="154.0" font-size="12" fill="#f5a623" text-anchor="start" font-weight="bold" font-family="Inter,ui-sans-serif,sans-serif" >Run:</text>
<text x="376.0" y="170.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >A contiguous block of layers all printed with the same filament.</text>
<text x="376.0" y="185.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >Its height is set by the colour's brightness in the source image.</text>
<text x="364.0" y="208.0" font-size="12" fill="#4ecca3" text-anchor="start" font-weight="bold" font-family="Inter,ui-sans-serif,sans-serif" >Window  (N = 3 runs):</text>
<text x="376.0" y="224.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >Exactly N = 3 consecutive runs form one window. The printer</text>
<text x="376.0" y="239.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >pauses at each boundary so the operator can reload any of the 3</text>
<text x="376.0" y="254.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >nozzle slots. Each window gets its own optimal filament assignment.</text>
<text x="364.0" y="277.0" font-size="12" fill="#f5a623" text-anchor="start" font-weight="bold" font-family="Inter,ui-sans-serif,sans-serif" >Claimed  (inside a window):</text>
<text x="376.0" y="293.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >Each slot is loaded with the filament that best matches the target</text>
<text x="376.0" y="308.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >colours across those layers. All 3 runs print under coordinated</text>
<text x="376.0" y="323.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >multi-head control — the algorithm chose the assignment.</text>
<text x="364.0" y="346.0" font-size="12" fill="#a1a1aa" text-anchor="start" font-weight="bold" font-family="Inter,ui-sans-serif,sans-serif" >Unclaimed  (outside any full window):</text>
<text x="376.0" y="362.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >Runs that don't complete a group of N are printed with whatever</text>
<text x="376.0" y="377.0" font-size="11" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >filament was last loaded. No dedicated assignment, no head-swap.</text>
<rect x="364.0" y="436.0" width="32.0" height="16.0" fill="#2980b9" stroke="none" rx="2" />
<line x1="364.0" y1="440.0" x2="396.0" y2="440.0" stroke="#000000" stroke-width="0.8" stroke-opacity="0.3"/>
<line x1="364.0" y1="444.0" x2="396.0" y2="444.0" stroke="#000000" stroke-width="0.8" stroke-opacity="0.3"/>
<line x1="364.0" y1="448.0" x2="396.0" y2="448.0" stroke="#000000" stroke-width="0.8" stroke-opacity="0.3"/>
<text x="404.0" y="448.0" font-size="10" fill="#a1a1aa" text-anchor="start" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >Each horizontal stripe = one printed layer (~0.2 mm)</text>
<text x="410.0" y="530.0" font-size="10" fill="#a1a1aa" text-anchor="middle" font-weight="normal" font-family="Inter,ui-sans-serif,sans-serif" >Kromacut · multi-head colour analysis</text>
</svg>