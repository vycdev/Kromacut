<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="bake-title bake-desc">
<title id="bake-title" data-i18n="title">Preview first, then bake the image</title><desc id="bake-desc" data-i18n="description">Adjustments create a non-destructive preview. Apply writes adjusted pixels into the working image and resets sliders. Downstream quantization, image download, and 3D use the working image.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/></marker><pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#546175"/><path d="M0 0H10V10H0ZM10 10H20V20H10Z" fill="#9aa9bb"/></pattern></defs>
<style>text{font-family:Arial,sans-serif;fill:#f1f5f9}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:18px;fill:#b3c2d4}.accent{font-size:20px;font-weight:600;fill:#38bdf8}.amber{font-size:20px;font-weight:600;fill:#fbbf24}</style>
<rect x="0" y="0" width="960" height="540" fill="#121923" /><text x="28" y="42" class="title"  data-i18n="previewFirstThenBakeTheImage">Preview first, then bake the image</text><text x="28" y="76" class="small"  data-i18n="aVisibleAdjustmentIsNotYetAChange">A visible adjustment is not yet a change to the source pixels.</text><rect x="28" y="120" width="250" height="145" fill="#1b2736" rx="14"/><text x="48" y="159" class="accent"  data-i18n="workingImage">Working image</text><text x="48" y="195" class="small"  data-i18n="originalOrLastSavedEdit">Original or last saved edit</text><rect x="48" y="216" width="209" height="22" fill="#59758f" rx="5"/><rect x="348" y="120" width="250" height="145" fill="#1b2736" rx="14"/><text x="368" y="159" class="accent"  data-i18n="livePreview">Live preview</text><text x="368" y="195" class="small"  data-i18n="slidersChangeTheLook">Sliders change the look</text><rect x="368" y="216" width="209" height="22" fill="#94d4ed" rx="5"/><path d="M285 190 L338 190" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><rect x="348" y="340" width="250" height="121" fill="#1b2736" rx="14"/><text x="368" y="378" class="accent"  data-i18n="newWorkingImage">New working image</text><text x="368" y="411" class="small"  data-i18n="appearanceIsBakedIn">Appearance is baked in</text><text x="368" y="440" class="small"  data-i18n="slidersResetToZero">Sliders reset to zero</text><path d="M473 273 L473 330" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><text x="492" y="309" class="amber"  data-i18n="apply">Apply</text><rect x="720" y="130" width="212" height="80" fill="#1b2736" rx="14"/><rect x="720" y="250" width="212" height="80" fill="#1b2736" rx="14"/><rect x="720" y="370" width="212" height="80" fill="#1b2736" rx="14"/><text x="741" y="178" class="label"  data-i18n="quantization">Quantization</text><text x="741" y="298" class="label"  data-i18n="pNGDownload">PNG download</text><text x="741" y="418" class="label"  data-i18n="label3DGeneration">3D generation</text><path d="M607 400 L673 400" fill="none" stroke="#38bdf8" stroke-width="3" /><path d="M673 170 L673 410" fill="none" stroke="#38bdf8" stroke-width="3" /><path d="M673 170 L710 170" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M673 290 L710 290" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M673 410 L710 410" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><text x="28" y="506" class="small"  data-i18n="withoutApplyTheseStepsStillUseTheUnderlying">Without Apply, these steps still use the underlying image, not the live preview.</text></svg>
