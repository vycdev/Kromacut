<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="opt-title opt-desc"><title id="opt-title">Choose where the optimizer spends its effort</title><desc id="opt-desc">The same image is weighted equally, toward its center, or toward edges. Separate transition-detail examples show increasing potential height choices, not exact layer counts.</desc><defs><radialGradient id="weight-1"><stop offset="0" stop-color="#121923" stop-opacity="0"/><stop offset="0.4" stop-color="#121923" stop-opacity="0"/><stop offset="1" stop-color="#121923" stop-opacity="0.8"/></radialGradient><radialGradient id="weight-2"><stop offset="0" stop-color="#121923" stop-opacity="0.8"/><stop offset="0.4" stop-color="#121923" stop-opacity="0.65"/><stop offset="1" stop-color="#121923" stop-opacity="0"/></radialGradient></defs><rect width="960" height="550" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700">Choose where matching effort goes</text><rect x="24" y="80" width="288" height="232" fill="#1b2736" rx="12"/><text x="44" y="112" fill="#f1f5f9" font-size="21" font-weight="700">Uniform</text><rect x="44" y="133" width="248" height="126" fill="#35627b" rx="0"/><rect x="59" y="148" width="35" height="96" fill="#fbbf24" rx="0"/><rect x="230" y="148" width="47" height="96" fill="#fbbf24" rx="0"/><rect x="123" y="158" width="84" height="76" fill="#a78bfa" rx="0"/><text x="44" y="291" fill="#b3c2d4" font-size="18" font-weight="400">All pixels count equally.</text><rect x="336" y="80" width="288" height="232" fill="#1b2736" rx="12"/><text x="356" y="112" fill="#f1f5f9" font-size="21" font-weight="700">Center-weighted</text><rect x="356" y="133" width="248" height="126" fill="#35627b" rx="0"/><rect x="371" y="148" width="35" height="96" fill="#fbbf24" rx="0"/><rect x="542" y="148" width="47" height="96" fill="#fbbf24" rx="0"/><rect x="435" y="158" width="84" height="76" fill="#a78bfa" rx="0"/><rect x="356" y="133" width="248" height="126" fill="url(#weight-1)"/><text x="356" y="291" fill="#b3c2d4" font-size="18" font-weight="400">Middle colors matter more.</text><rect x="648" y="80" width="288" height="232" fill="#1b2736" rx="12"/><text x="668" y="112" fill="#f1f5f9" font-size="21" font-weight="700">Edge-weighted</text><rect x="668" y="133" width="248" height="126" fill="#35627b" rx="0"/><rect x="683" y="148" width="35" height="96" fill="#fbbf24" rx="0"/><rect x="854" y="148" width="47" height="96" fill="#fbbf24" rx="0"/><rect x="747" y="158" width="84" height="76" fill="#a78bfa" rx="0"/><rect x="668" y="133" width="248" height="126" fill="url(#weight-2)"/><text x="668" y="291" fill="#b3c2d4" font-size="18" font-weight="400">Outer colors matter more.</text><rect x="24" y="326" width="912" height="147" fill="#1b2736" rx="12"/><text x="44" y="358" fill="#38bdf8" font-size="21" font-weight="700">Transition detail: more potential thickness choices</text><text x="44" y="392" fill="#f1f5f9" font-size="18" font-weight="400">Compact · 80%</text><rect x="44" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="74" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="104" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><text x="342" y="392" fill="#f1f5f9" font-size="18" font-weight="400">Detailed · 90%</text><rect x="342" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="372" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="402" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="432" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="462" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><text x="640" y="392" fill="#f1f5f9" font-size="18" font-weight="400">Maximum · 95%</text><rect x="640" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="670" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="700" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="730" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="760" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="790" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><rect x="820" y="413" width="25" height="27" fill="#38bdf8" rx="2"/><text x="28" y="504" fill="#b3c2d4" font-size="18" font-weight="400">Fast → Balanced → Thorough → Deep: more search work, not guaranteed print accuracy.</text><text x="28" y="530" fill="#b3c2d4" font-size="18" font-weight="400">Schematic weighting and choices. Early convergence and Max Height can limit transitions.</text></g></svg>
