<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="repeat-title repeat-desc"><title id="repeat-title" data-i18n="title">Repeats and separation solve different problems</title><desc id="repeat-desc" data-i18n="description">A repeated material expands possible stack sequences. Separation assigns distinct outputs; partial mode can merge an unmatched target.</desc><rect width="960" height="480" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700" data-i18n="repeatsAndSeparationSolveDifferentProblems">Repeats and separation solve different problems</text><rect x="24" y="78" width="912" height="122" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="110" fill="#38bdf8" font-size="21" font-weight="700" data-i18n="sharedRepeatBudget">Shared repeat budget</text><rect x="44" y="134" width="160" height="42" rx="6" fill="#344155" stroke="none"/><text x="85" y="162" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="black">Black</text><line x1="216" y1="155" x2="276" y2="155" stroke="#38bdf8" stroke-width="3"/><path d="M 267 148 L 276 155 L 267 162" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="292" y="134" width="160" height="42" rx="6" fill="#fbbf24" stroke="none"/><text x="331" y="162" fill="#121923" font-size="18" font-weight="400" data-i18n="yellow">Yellow</text><line x1="466" y1="155" x2="526" y2="155" stroke="#38bdf8" stroke-width="3"/><path d="M 517 148 L 526 155 L 517 162" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="544" y="134" width="160" height="42" rx="6" fill="#344155" stroke="none"/><text x="585" y="162" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="black">Black</text><text x="730" y="160" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="label1ExtraAppearance">1 extra appearance</text><rect x="24" y="216" width="440" height="194" rx="12" fill="#1b2736" stroke="none"/><rect x="496" y="216" width="440" height="194" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="251" fill="#38bdf8" font-size="21" font-weight="700" data-i18n="distinctOutputs">Distinct outputs</text><text x="516" y="251" fill="#fbbf24" font-size="21" font-weight="700" data-i18n="partialPalette">Partial palette</text><text x="44" y="288" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="targetAOutput1">Target A → Output 1</text><text x="44" y="323" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="targetBOutput2">Target B → Output 2</text><text x="44" y="358" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="targetCOutput3">Target C → Output 3</text><text x="516" y="288" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="targetAOutput1">Target A → Output 1</text><text x="516" y="323" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="targetBOutput2">Target B → Output 2</text><text x="516" y="358" fill="#f1f5f9" font-size="18" font-weight="400" data-i18n="targetCOutput2Merged">Target C → Output 2 (merged)</text><text x="28" y="446" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="conceptualExamplesStrictModeRejectsAnIncompleteDistinct">Conceptual examples. Strict mode rejects an incomplete distinct-color assignment.</text></g></svg>
