<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="smooth-title smooth-desc"><title id="smooth-title" data-i18n="title">Smooth contours, same source detail</title><desc id="smooth-desc" data-i18n="description">A stair-stepped diagonal becomes a connected smoother boundary. Pixel size and layer height do not change.</desc><rect width="960" height="480" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700" data-i18n="smoothContoursSameSourceDetail">Smooth contours, same source detail</text><rect x="24" y="78" width="440" height="332" rx="12" fill="#1b2736" stroke="none"/><rect x="496" y="78" width="440" height="332" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="111" fill="#fbbf24" font-size="21" font-weight="700" data-i18n="smoothMeshingOff">Smooth Meshing off</text><text x="516" y="111" fill="#38bdf8" font-size="21" font-weight="700" data-i18n="smoothMeshingOn">Smooth Meshing on</text><path d="M80 323V283H132V243H184V203H236V163H288V123H388V323Z" fill="#a78bfa"/><path d="M548 323V294L572 275L624 235L676 195L728 155L780 123H860V323Z" fill="#38bdf8"/><text x="44" y="369" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="squarePixelStepsRemain">Square pixel steps remain.</text><text x="516" y="369" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="connectedBoundariesAreSmoothed">Connected boundaries are smoothed.</text><text x="28" y="446" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="schematicOutlineOnlyBothChoicesAlterExportedContours">Schematic outline only. Both choices alter exported contours; neither adds source pixels.</text></g></svg>
