<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="flat-title flat-desc"><title id="flat-title">Same artwork, three physical arrangements</title><desc id="flat-desc">Each three-column cross-section uses black foundation, orange middle, and yellow upper materials. Face-down reverses columns and adds a carrier; face-up raises shorter columns.</desc><rect width="960" height="480" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700">Same artwork, three physical arrangements</text><rect x="24" y="78" width="288" height="332" rx="12" fill="#1b2736" stroke="none"/><rect x="336" y="78" width="288" height="332" rx="12" fill="#1b2736" stroke="none"/><rect x="648" y="78" width="288" height="332" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="111" fill="#f1f5f9" font-size="21" font-weight="700">Normal relief</text><text x="356" y="111" fill="#38bdf8" font-size="21" font-weight="700">Face-down + carrier</text><text x="668" y="111" fill="#a78bfa" font-size="21" font-weight="700">Face-up, no carrier</text><rect x="60" y="267" width="72" height="63" rx="0" fill="#344155" stroke="none"/><rect x="132" y="237" width="72" height="93" rx="0" fill="#344155" stroke="none"/><rect x="204" y="205" width="72" height="125" rx="0" fill="#344155" stroke="none"/><rect x="132" y="237" width="72" height="30" rx="0" fill="#cf7254" stroke="none"/><rect x="204" y="235" width="72" height="32" rx="0" fill="#cf7254" stroke="none"/><rect x="204" y="205" width="72" height="30" rx="0" fill="#fbbf24" stroke="none"/><rect x="372" y="205" width="216" height="125" rx="0" fill="#344155" stroke="none"/><rect x="444" y="298" width="72" height="32" rx="0" fill="#cf7254" stroke="none"/><rect x="516" y="268" width="72" height="32" rx="0" fill="#cf7254" stroke="none"/><rect x="516" y="300" width="72" height="30" rx="0" fill="#fbbf24" stroke="none"/><rect x="372" y="333" width="216" height="12" rx="0" fill="#9cddf4" stroke="none"/><rect x="684" y="205" width="216" height="125" rx="0" fill="#344155" stroke="none"/><rect x="756" y="205" width="72" height="32" rx="0" fill="#cf7254" stroke="none"/><rect x="828" y="205" width="72" height="30" rx="0" fill="#fbbf24" stroke="none"/><rect x="828" y="235" width="72" height="32" rx="0" fill="#cf7254" stroke="none"/><text x="60" y="170" fill="#b3c2d4" font-size="18" font-weight="400">View from above</text><text x="372" y="170" fill="#b3c2d4" font-size="18" font-weight="400">Foundation behind</text><text x="684" y="170" fill="#b3c2d4" font-size="18" font-weight="400">View from above</text><text x="44" y="378" fill="#b3c2d4" font-size="18" font-weight="400">Columns stop at their color.</text><text x="356" y="378" fill="#b3c2d4" font-size="18" font-weight="400">View through clear bottom.</text><text x="668" y="378" fill="#b3c2d4" font-size="18" font-weight="400">Foundation fills underneath.</text><text x="28" y="446" fill="#b3c2d4" font-size="18" font-weight="400">Schematic cross-sections. Flat Paint needs multi-material 3MF; never mirror it again.</text></g></svg>
