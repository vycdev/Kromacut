<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="quantize-title quantize-desc">
<title id="quantize-title" data-i18n="title">Two limits, two different jobs</title><desc id="quantize-desc" data-i18n="description">Algorithm Weight sets an intermediate palette budget. Auto's Number of Colors limits the final result, or a fixed palette provides the permitted final colors. None skips the first stage only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/></marker><pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#546175"/><path d="M0 0H10V10H0ZM10 10H20V20H10Z" fill="#9aa9bb"/></pattern></defs>
<style>text{font-family:Arial,sans-serif;fill:#f1f5f9}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:18px;fill:#b3c2d4}.accent{font-size:20px;font-weight:600;fill:#38bdf8}.amber{font-size:20px;font-weight:600;fill:#fbbf24}</style>
<rect x="0" y="0" width="960" height="540" fill="#121923" /><text x="28" y="42" class="title"  data-i18n="twoLimitsTwoDifferentJobs">Two limits, two different jobs</text><text x="28" y="76" class="small"  data-i18n="exampleWeight128AutoTarget16TheResult">Example: Weight 128 → Auto target 16. The result may contain fewer colors.</text><rect x="28" y="148" width="198" height="133" fill="#1b2736" rx="14"/><text x="48" y="189" class="accent"  data-i18n="sourceImage">Source image</text><text x="48" y="223" class="small"  data-i18n="manyColors">Many colors</text><text x="48" y="254" class="small"  data-i18n="bakedAdjustments">Baked adjustments</text><rect x="290" y="106" width="312" height="280" fill="#1b2736" rx="14"/><text x="310" y="148" class="accent"  data-i18n="stage1Algorithm">Stage 1: Algorithm</text><text x="310" y="183" class="small"  data-i18n="weightUpTo128Colors">Weight: up to 128 colors</text><text x="310" y="224" class="small"  data-i18n="posterizeMedianCut">Posterize   ·   Median-cut</text><text x="310" y="258" class="small"  data-i18n="kMeansWuOctree">K-means   ·   Wu   ·   Octree</text><path d="M310 285 L582 285" fill="none" stroke="#546175" stroke-width="3" /><text x="310" y="322" class="label"  data-i18n="noneSkipsThisStage">None skips this stage</text><text x="310" y="358" class="small"  data-i18n="weightIsNotAPercentage">Weight is not a percentage</text><path d="M236 214 L278 214" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M612 214 L645 214" fill="none" stroke="#38bdf8" stroke-width="3" /><path d="M645 190 L645 356" fill="none" stroke="#38bdf8" stroke-width="3" /><path d="M645 190 L678 190" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M645 356 L678 356" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="111" width="242" height="140" fill="#1b2736" rx="14"/><text x="710" y="151" class="accent"  data-i18n="stage2Auto">Stage 2: Auto</text><text x="710" y="189" class="small"  data-i18n="numberOfColors16">Number of Colors: 16</text><text x="710" y="226" class="small"  data-i18n="finalResult16Colors">Final result ≤16 colors</text><rect x="690" y="283" width="242" height="140" fill="#1b2736" rx="14"/><text x="710" y="323" class="accent"  data-i18n="oRFixedPalette">OR: fixed palette</text><text x="710" y="359" class="small"  data-i18n="onlyEnabledColors">Only enabled colors</text><text x="710" y="396" class="small"  data-i18n="notEveryColorIsUsed">Not every color is used</text><text x="28" y="475" class="small"  data-i18n="applyChangesTheImageUndoBeforeTestingAnother">Apply changes the image. Undo before testing another setting from the same source.</text><text x="28" y="513" class="small"  data-i18n="transparentPixelsStayTransparentPartiallyTransparentPixelsBecome">Transparent pixels stay transparent; partially transparent pixels become opaque.</text></svg>
