<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="adjustments-title adjustments-desc">
<title id="adjustments-title" data-i18n="title">Twelve controls for the target image</title><desc id="adjustments-desc" data-i18n="description">Each control has schematic negative, zero, and positive color samples. Tone controls affect different brightness ranges, color controls shift hue or saturation, and clarity affects local edges.</desc>
