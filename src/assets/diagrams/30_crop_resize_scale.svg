<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="scale-title scale-desc">
<title id="scale-title" data-i18n="title">Pixels, framing, and physical size</title><desc id="scale-desc" data-i18n="description">Three schematic examples distinguish cropping a region, resampling to fewer pixels, and changing millimeters per pixel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/></marker><pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#546175"/><path d="M0 0H10V10H0ZM10 10H20V20H10Z" fill="#9aa9bb"/></pattern></defs>
<style>text{font-family:Arial,sans-serif;fill:#f1f5f9}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:18px;fill:#b3c2d4}.accent{font-size:20px;font-weight:600;fill:#38bdf8}.amber{font-size:20px;font-weight:600;fill:#fbbf24}</style>
<rect x="0" y="0" width="960" height="540" fill="#121923" /><text x="28" y="42" class="title"  data-i18n="pixelsFramingAndPhysicalSize">Pixels, framing, and physical size</text><text x="28" y="76" class="small"  data-i18n="startingExample1000800OpaquePixelsAt0">Starting example: 1000 × 800 opaque pixels at 0.1 mm/px = 100 × 80 mm</text><rect x="28" y="104" width="280" height="338" fill="#1b2736" rx="14"/><rect x="340" y="104" width="280" height="338" fill="#1b2736" rx="14"/><rect x="652" y="104" width="280" height="338" fill="#1b2736" rx="14"/><text x="48" y="141" class="accent"  data-i18n="crop">Crop</text><text x="360" y="141" class="accent"  data-i18n="resizeTo50">Resize to 50%</text><text x="672" y="141" class="accent"  data-i18n="changePixelSize">Change Pixel Size</text><rect x="48" y="174" width="240" height="154" fill="#334155" /><rect x="80" y="195" width="150" height="113" fill="#38bdf8" /><rect x="80" y="195" width="150" height="113" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 5"/><text x="48" y="358" class="small"  data-i18n="keepA600600Region">Keep a 600 × 600 region</text><text x="48" y="389" class="small"  data-i18n="label01MmPx6060Mm">0.1 mm/px → 60 × 60 mm</text><text x="48" y="420" class="small"  data-i18n="discardOutsideTheBox">Discard outside the box</text><rect x="378" y="181" width="27" height="27" fill="#38bdf8" /><rect x="406" y="181" width="27" height="27" fill="#38bdf8" /><rect x="434" y="181" width="27" height="27" fill="#38bdf8" /><rect x="462" y="181" width="27" height="27" fill="#38bdf8" /><rect x="490" y="181" width="27" height="27" fill="#38bdf8" /><rect x="518" y="181" width="27" height="27" fill="#38bdf8" /><rect x="378" y="209" width="27" height="27" fill="#38bdf8" /><rect x="406" y="209" width="27" height="27" fill="#a78bfa" /><rect x="434" y="209" width="27" height="27" fill="#a78bfa" /><rect x="462" y="209" width="27" height="27" fill="#a78bfa" /><rect x="490" y="209" width="27" height="27" fill="#38bdf8" /><rect x="518" y="209" width="27" height="27" fill="#38bdf8" /><rect x="378" y="237" width="27" height="27" fill="#38bdf8" /><rect x="406" y="237" width="27" height="27" fill="#a78bfa" /><rect x="434" y="237" width="27" height="27" fill="#fbbf24" /><rect x="462" y="237" width="27" height="27" fill="#a78bfa" /><rect x="490" y="237" width="27" height="27" fill="#38bdf8" /><rect x="518" y="237" width="27" height="27" fill="#38bdf8" /><rect x="378" y="265" width="27" height="27" fill="#38bdf8" /><rect x="406" y="265" width="27" height="27" fill="#38bdf8" /><rect x="434" y="265" width="27" height="27" fill="#fbbf24" /><rect x="462" y="265" width="27" height="27" fill="#38bdf8" /><rect x="490" y="265" width="27" height="27" fill="#38bdf8" /><rect x="518" y="265" width="27" height="27" fill="#38bdf8" /><rect x="378" y="293" width="27" height="27" fill="#38bdf8" /><rect x="406" y="293" width="27" height="27" fill="#38bdf8" /><rect x="434" y="293" width="27" height="27" fill="#38bdf8" /><rect x="462" y="293" width="27" height="27" fill="#38bdf8" /><rect x="490" y="293" width="27" height="27" fill="#38bdf8" /><rect x="518" y="293" width="27" height="27" fill="#38bdf8" /><text x="360" y="358" class="small"  data-i18n="label500400Pixels">500 × 400 pixels</text><text x="360" y="389" class="small"  data-i18n="label01MmPx5040Mm">0.1 mm/px → 50 × 40 mm</text><text x="360" y="420" class="small"  data-i18n="fewerSourcePixels">Fewer source pixels</text><g transform="translate(0 -16)"><rect x="680" y="174" width="35" height="35" fill="#38bdf8" /><rect x="716" y="174" width="35" height="35" fill="#38bdf8" /><rect x="752" y="174" width="35" height="35" fill="#38bdf8" /><rect x="788" y="174" width="35" height="35" fill="#38bdf8" /><rect x="824" y="174" width="35" height="35" fill="#38bdf8" /><rect x="860" y="174" width="35" height="35" fill="#38bdf8" /><rect x="680" y="210" width="35" height="35" fill="#38bdf8" /><rect x="716" y="210" width="35" height="35" fill="#a78bfa" /><rect x="752" y="210" width="35" height="35" fill="#a78bfa" /><rect x="788" y="210" width="35" height="35" fill="#a78bfa" /><rect x="824" y="210" width="35" height="35" fill="#38bdf8" /><rect x="860" y="210" width="35" height="35" fill="#38bdf8" /><rect x="680" y="246" width="35" height="35" fill="#38bdf8" /><rect x="716" y="246" width="35" height="35" fill="#a78bfa" /><rect x="752" y="246" width="35" height="35" fill="#fbbf24" /><rect x="788" y="246" width="35" height="35" fill="#a78bfa" /><rect x="824" y="246" width="35" height="35" fill="#38bdf8" /><rect x="860" y="246" width="35" height="35" fill="#38bdf8" /><rect x="680" y="282" width="35" height="35" fill="#38bdf8" /><rect x="716" y="282" width="35" height="35" fill="#38bdf8" /><rect x="752" y="282" width="35" height="35" fill="#fbbf24" /><rect x="788" y="282" width="35" height="35" fill="#38bdf8" /><rect x="824" y="282" width="35" height="35" fill="#38bdf8" /><rect x="860" y="282" width="35" height="35" fill="#38bdf8" /><rect x="680" y="318" width="35" height="35" fill="#38bdf8" /><rect x="716" y="318" width="35" height="35" fill="#38bdf8" /><rect x="752" y="318" width="35" height="35" fill="#38bdf8" /><rect x="788" y="318" width="35" height="35" fill="#38bdf8" /><rect x="824" y="318" width="35" height="35" fill="#38bdf8" /><rect x="860" y="318" width="35" height="35" fill="#38bdf8" /></g><text x="672" y="358" class="small"  data-i18n="same500400Pixels">Same 500 × 400 pixels</text><text x="672" y="389" class="small"  data-i18n="label02MmPx10080Mm">0.2 mm/px → 100 × 80 mm</text><text x="672" y="420" class="small"  data-i18n="samePixelsLargerPrint">Same pixels, larger print</text><text x="28" y="484" class="label"  data-i18n="zoomChangesNoneOfTheseItOnlyChanges">Zoom changes none of these. It only changes your view.</text><text x="28" y="516" class="small"  data-i18n="transparentOuterMarginsAreExcludedFromThePrinted">Transparent outer margins are excluded from the printed footprint. Schematic, not to scale.</text></svg>
