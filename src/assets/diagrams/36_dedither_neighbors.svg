<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="dedither-title dedither-desc">
<title id="dedither-title" data-i18n="title">Neighbor support, not a blur radius</title><desc id="dedither-desc" data-i18n="description">In the example the pink center has three same-color neighbors and five cyan alternatives. It remains pink at Weight 3 and becomes cyan at Weight 4. More passes repeat cleanup, potentially removing thin features.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/></marker><pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#546175"/><path d="M0 0H10V10H0ZM10 10H20V20H10Z" fill="#9aa9bb"/></pattern></defs>
<style>text{font-family:Arial,sans-serif;fill:#f1f5f9}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:18px;fill:#b3c2d4}.accent{font-size:20px;font-weight:600;fill:#38bdf8}.amber{font-size:20px;font-weight:600;fill:#fbbf24}</style>
<rect x="0" y="0" width="960" height="540" fill="#121923" /><text x="28" y="42" class="title"  data-i18n="neighborSupportNotABlurRadius">Neighbor support, not a blur radius</text><text x="28" y="76" class="small"  data-i18n="aPixelChecksEightNeighborsIncludingDiagonalsExact">A pixel checks eight neighbors, including diagonals. Exact RGB and alpha must match.</text><rect x="28" y="111" width="280" height="300" fill="#1b2736" rx="14"/><text x="48" y="151" class="accent"  data-i18n="threeMatchingNeighbors">Three matching neighbors</text><rect x="84" y="181" width="49" height="49" fill="#fb7185" /><rect x="134" y="181" width="49" height="49" fill="#fb7185" /><rect x="184" y="181" width="49" height="49" fill="#38bdf8" /><rect x="84" y="231" width="49" height="49" fill="#38bdf8" /><rect x="134" y="231" width="49" height="49" fill="#fb7185" /><rect x="184" y="231" width="49" height="49" fill="#38bdf8" /><rect x="84" y="281" width="49" height="49" fill="#fb7185" /><rect x="134" y="281" width="49" height="49" fill="#38bdf8" /><rect x="184" y="281" width="49" height="49" fill="#38bdf8" /><rect x="133" y="230" width="50" height="50" fill="none" stroke="#f1f5f9" stroke-width="3"/><text x="48" y="366" class="small"  data-i18n="pinkCenter3Pink5Cyan">Pink center: 3 pink, 5 cyan</text><rect x="340" y="111" width="280" height="300" fill="#1b2736" rx="14"/><text x="360" y="151" class="accent"  data-i18n="weight3">Weight 3</text><rect x="448" y="220" width="64" height="64" fill="#fb7185" /><text x="360" y="338" class="label"  data-i18n="label33KeepTheCenter">3 ≥ 3: keep the center</text><text x="360" y="371" class="small"  data-i18n="sameColorSupportIsEnough">Same-color support is enough</text><rect x="652" y="111" width="280" height="300" fill="#1b2736" rx="14"/><text x="672" y="151" class="accent"  data-i18n="weight4">Weight 4</text><rect x="760" y="220" width="64" height="64" fill="#38bdf8" /><text x="672" y="338" class="label"  data-i18n="label34ChooseCyan">3 &lt; 4: choose cyan</text><text x="672" y="371" class="small" data-i18n="mostCommonDifferent">Most common different</text><text x="672" y="397" class="small" data-i18n="neighbor">neighbor</text><path d="M310 263 L331 263" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M622 263 L643 263" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><text x="28" y="464" class="small"  data-i18n="pass1NewImagePass2NewImage">Pass 1 → new image → Pass 2 → new image. More passes can erase small features.</text><text x="28" y="502" class="small" data-i18n="weight19Default4">Weight 1–9 (default 4)</text><text x="340" y="502" class="small" data-i18n="passes110Default1">Passes 1–10 (default 1)</text><text x="652" y="502" class="small" data-i18n="tiedChoicesCanVary">Tied choices can vary.</text></svg>
