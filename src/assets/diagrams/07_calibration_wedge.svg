<rect x="594.67" y="326" width="59.33" height="36" fill="#e67e22" stroke="#18181b" stroke-width="0.5"/>
<rect x="654" y="322" width="59.33" height="40" fill="#e67e22" stroke="#18181b" stroke-width="0.5"/>
<rect x="713.33" y="318" width="59.33" height="44" fill="#e67e22" stroke="#18181b" stroke-width="0.5"/>
<rect x="772.67" y="314" width="59.33" height="48" fill="#e67e22" stroke="#18181b" stroke-width="0.5"/>
<rect x="120" y="362" width="712" height="26" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
<text x="476" y="379" font-size="9" fill="#71717a" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif">base filament</text>
<line x1="100" y1="362" x2="852" y2="362" stroke="#f5a623" stroke-width="1.2" stroke-dasharray="6,3"/>
<text x="856" y="360" font-size="9" fill="#f5a623" text-anchor="start" font-family="Inter,ui-sans-serif,sans-serif">single swap:</text>
<text x="856" y="372" font-size="9" fill="#f5a623" text-anchor="start" font-family="Inter,ui-sans-serif,sans-serif">base → color</text>

<text x="480" y="452" font-size="10" fill="#71717a" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif">Kromacut · frontlit calibration</text>
</svg>
