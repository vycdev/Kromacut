<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" aria-labelledby="width-title width-desc">
  <title id="width-title">A thin stripe: compare its width, then choose whether to keep it</title>
  <desc id="width-desc">At 0.10 mm per pixel, a two-pixel purple stripe is 0.20 mm wide, narrower than the planned 0.40 mm extrusion width. The preview marks it amber as a warning, not as a new filament color. With Omit at-risk colors from matching off, the stripe remains a target in Auto-paint's input. With it on, this stripe is replaced by its suitable blue neighbor, leaving a blue region rather than a hole. These are input colors, not guaranteed print colors. The original 2D image is unchanged.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#f1f5f9;font-size:20px}
    .title{font-size:26px;font-weight:700}
    .heading{font-size:22px;font-weight:700}
    .note{font-size:18px;fill:#b3c2d4}
    .panel{fill:#1b2736}
    .purple{fill:#a78bfa}
    .cyan{fill:#38bdf8}
    .amber{fill:#fbbf24}
  </style>
  <rect width="960" height="744" rx="16" fill="#121923"/>
  <text x="28" y="44" class="title">Why a thin detail may disappear</text>
  <text x="28" y="78">Example: Pixel Size = 0.10 mm/pixel. Stripe = 2 pixels = 0.20 mm.</text>

  <rect x="24" y="104" width="440" height="244" rx="12" class="panel"/>
  <text x="44" y="138" class="heading">1. Compare the widths</text>
  <text x="44" y="180">Purple stripe</text>
  <rect x="44" y="194" width="120" height="24" rx="3" class="purple"/>
  <text x="180" y="214" class="purple">0.20 mm</text>
  <text x="44" y="258">Planned extrusion line</text>
  <rect x="44" y="272" width="240" height="24" rx="3" class="cyan"/>
  <text x="300" y="292" class="cyan">0.40 mm</text>
  <text x="44" y="328" class="note">The planned line is twice as wide as the stripe.</text>

  <rect x="496" y="104" width="440" height="244" rx="12" class="panel"/>
  <text x="516" y="138" class="heading">2. Inspect the warning</text>
  <rect x="516" y="166" width="132" height="132" fill="#35627b"/>
  <rect x="576" y="166" width="12" height="132" class="amber"/>
  <text x="672" y="190" class="amber">Amber = warning</text>
  <text x="672" y="220" class="note">Not a yellow filament.</text>
  <text x="672" y="266">This stripe is at risk</text>
  <text x="672" y="294">in the slicer.</text>
  <text x="516" y="328" class="note">The overlay only highlights the problem.</text>

  <text x="28" y="384" class="heading">3. Choose: “Omit at-risk colors from matching”</text>
  <text x="28" y="414" class="note">Below: input to Auto-paint, not a prediction of the finished print.</text>
  <rect x="24" y="434" width="440" height="216" rx="12" class="panel"/>
  <text x="44" y="466" class="heading purple">OFF: keep the stripe</text>
  <rect x="44" y="478" width="132" height="132" fill="#35627b"/>
  <rect x="104" y="478" width="12" height="132" class="purple"/>
  <text x="200" y="506">Purple stays as an</text>
  <text x="200" y="534">image-color target.</text>
  <text x="200" y="598" class="note">The slicer may still lose it.</text>

  <rect x="496" y="434" width="440" height="216" rx="12" class="panel"/>
  <text x="516" y="466" class="heading cyan">ON: use the nearby blue</text>
  <rect x="516" y="478" width="132" height="132" fill="#35627b"/>
  <text x="672" y="494">The stripe is replaced</text>
  <text x="672" y="522">with nearby blue.</text>
  <text x="672" y="570">A blue region,</text>
  <text x="672" y="598">not a hole.</text>

  <text x="28" y="686" class="note">Your 2D image stays unchanged. Schematic analysis, not exact slicer toolpaths.</text>
  <text x="28" y="716" class="note">If no suitable printable neighbor exists, Kromacut keeps the detail.</text>
</svg>
