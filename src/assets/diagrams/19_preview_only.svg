<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="preview-title preview-desc"><title id="preview-title" data-i18n="title">Inspecting a range does not crop the print</title><desc id="preview-desc" data-i18n="description">Lower and upper layers are hidden in the preview but all four layers remain in the export.</desc><rect width="960" height="480" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700" data-i18n="inspectingARangeDoesNotCropThePrint">Inspecting a range does not crop the print</text><rect x="24" y="78" width="440" height="332" rx="12" fill="#1b2736" stroke="none"/><rect x="496" y="78" width="440" height="332" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="111" fill="#38bdf8" font-size="21" font-weight="700" data-i18n="layerPreviewSelectedRange">Layer Preview: selected range</text><text x="516" y="111" fill="#fbbf24" font-size="21" font-weight="700" data-i18n="exportCompleteModel">Export: complete model</text><rect x="92" y="295" width="290" height="38" rx="0" fill="#1b2736" stroke="#506071"/><rect x="560" y="295" width="290" height="38" rx="0" fill="#344155" stroke="none"/><rect x="92" y="253" width="290" height="38" rx="0" fill="#a78bfa" stroke="none"/><rect x="560" y="253" width="290" height="38" rx="0" fill="#a78bfa" stroke="none"/><rect x="92" y="211" width="290" height="38" rx="0" fill="#38bdf8" stroke="none"/><rect x="560" y="211" width="290" height="38" rx="0" fill="#38bdf8" stroke="none"/><rect x="92" y="169" width="290" height="38" rx="0" fill="#1b2736" stroke="#506071"/><rect x="560" y="169" width="290" height="38" rx="0" fill="#fbbf24" stroke="none"/><text x="44" y="368" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="outsideTheRangeHidden">Outside the range: hidden.</text><text x="516" y="368" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="allLayersAndMaterialsRemain">All layers and materials remain.</text><text x="28" y="446" fill="#b3c2d4" font-size="18" font-weight="400" data-i18n="schematicCameraShadingWireframeAndPreviewColorsAre">Schematic. Camera, shading, wireframe, and preview colors are inspection-only too.</text></g></svg>
