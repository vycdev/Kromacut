<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="cap-title cap-desc"><title id="cap-title">A height cap squeezes transitions, not the foundation</title><desc id="cap-desc">The foundation stays opaque while upper runs are compressed to fit a lower printable cap.</desc><rect width="960" height="480" rx="16" fill="#121923"/><g font-family="system-ui, sans-serif"><text x="28" y="43" fill="#f1f5f9" font-size="26" font-weight="700">A height cap squeezes transitions, not the foundation</text><rect x="24" y="78" width="440" height="332" rx="12" fill="#1b2736" stroke="none"/><rect x="496" y="78" width="440" height="332" rx="12" fill="#1b2736" stroke="none"/><text x="44" y="110" fill="#38bdf8" font-size="21" font-weight="700">Auto height</text><text x="516" y="110" fill="#fbbf24" font-size="21" font-weight="700">Lower Max Height</text><rect x="80" y="272" width="328" height="64" rx="0" fill="#344155" stroke="none"/><rect x="80" y="208" width="328" height="64" rx="0" fill="#a78bfa" stroke="none"/><rect x="80" y="136" width="328" height="72" rx="0" fill="#38bdf8" stroke="none"/><rect x="552" y="272" width="328" height="64" rx="0" fill="#344155" stroke="none"/><rect x="552" y="240" width="328" height="32" rx="0" fill="#a78bfa" stroke="none"/><rect x="552" y="204" width="328" height="36" rx="0" fill="#38bdf8" stroke="none"/><line x1="525" y1="198" x2="906" y2="198" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5"/><text x="564" y="179" fill="#fbbf24" font-size="18" font-weight="400">Printable cap</text><text x="110" y="310" fill="#f1f5f9" font-size="18" font-weight="400">Opaque foundation</text><text x="583" y="310" fill="#f1f5f9" font-size="18" font-weight="400">Opaque foundation</text><text x="44" y="378" fill="#b3c2d4" font-size="18" font-weight="400">More transition thickness.</text><text x="516" y="378" fill="#b3c2d4" font-size="18" font-weight="400">Fewer intermediate height choices.</text><text x="28" y="446" fill="#b3c2d4" font-size="18" font-weight="400">Schematic. An impossibly low cap fails instead of shrinking the opaque foundation.</text></g></svg>
