<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Palette Proof candidates are stopping heights on one stack</title>
<desc id="desc">An illustrative proof map has two target rows and three candidates A through C. An F-marked candidate is the shared foundation margin, not an extra printed color. A side view of one target's candidates shows the same material order, with each candidate stopping at a different layer prefix. Horizontal layers use the same filament wherever they continue. Colors and heights are schematic.</desc>
<rect width="960" height="540" rx="18" fill="#121923"/>
<g font-family="system-ui, sans-serif" font-size="18" fill="#f1f5f9">
<text x="32" y="44" font-size="26" font-weight="700">Candidates stop at different heights of the same stack</text>
<text x="32" y="74" fill="#b3c2d4">A prefix includes the foundation and every preceding layer, in physical print order.</text>
<rect x="32" y="100" width="414" height="339" rx="14" fill="#1b2736"/><text x="52" y="134" fill="#38bdf8" font-weight="700">Proof map: two example targets</text><text x="52" y="176" fill="#b3c2d4">Target</text>
<g text-anchor="middle" fill="#b3c2d4"><text x="203" y="176">A</text><text x="275" y="176">B</text><text x="347" y="176">C</text></g>
<rect x="52" y="192" width="70" height="58" rx="7" fill="#e5c581"/><rect x="52" y="260" width="70" height="58" rx="7" fill="#a78bfa"/>
<g stroke="#121923" stroke-width="2">
<rect x="167" y="192" width="72" height="58" fill="#ad854c"/><rect x="239" y="192" width="72" height="58" fill="#cda762"/><rect x="311" y="192" width="72" height="58" fill="#e3bc73"/>
<rect x="167" y="260" width="72" height="58" fill="#293647"/><rect x="239" y="260" width="72" height="58" fill="#695a99"/><rect x="311" y="260" width="72" height="58" fill="#8d76be"/>
</g>
<rect x="168" y="261" width="70" height="56" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
<g text-anchor="middle" font-weight="700">
<text x="87" y="228" fill="#121923">1</text><text x="87" y="296" fill="#121923">2</text><text x="203" y="228" fill="#121923">A1</text><text x="275" y="228" fill="#121923">B1</text><text x="347" y="228" fill="#121923">C1</text>
<text x="203" y="296" fill="#fbbf24">A2 F</text><text x="275" y="296">B2</text><text x="347" y="296">C2</text>
</g>
<text x="52" y="354" fill="#b3c2d4">Numbers = target rows</text><text x="52" y="383" fill="#b3c2d4">Letters = candidate columns</text><text x="52" y="412" fill="#fbbf24">F = compare the foundation margin</text>
<rect x="464" y="100" width="464" height="339" rx="14" fill="#1b2736"/><text x="484" y="134" fill="#38bdf8" font-weight="700">Side view of one candidate row</text>
<g stroke="#121923" stroke-width="2">
<rect x="501" y="323" width="384" height="34" fill="#293647"/><rect x="525" y="289" width="336" height="34" fill="#38bdf8"/><rect x="637" y="255" width="224" height="34" fill="#a78bfa"/><rect x="749" y="221" width="112" height="34" fill="#fbbf24"/><rect x="749" y="187" width="112" height="34" fill="#e6bd78"/>
</g>
<g text-anchor="middle" font-weight="700"><text x="581" y="274">A</text><text x="693" y="240">B</text><text x="805" y="172">C</text></g>
<path d="M637 287V323M749 253V323" stroke="#f1f5f9" stroke-dasharray="4 4" opacity="0.6"/>
<text x="484" y="387" fill="#b3c2d4">One filament per horizontal layer.</text><text x="484" y="415" fill="#b3c2d4">Later prefixes keep every layer below.</text>
<rect x="32" y="457" width="896" height="52" rx="12" fill="#1b2736"/><text x="52" y="489" fill="#b3c2d4">Touching patches share a continuous foundation. Targets are not additional printed colors.</text>
<text x="928" y="532" text-anchor="end" fill="#b3c2d4">Schematic layout, layers, and appearance; not to scale</text>
</g>
</svg>
