<text x="700" y="385" font-size="9" fill="#a1a1aa" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif">continuous first-layer foundation; 1 mm trenches remain connected below</text>
<text x="700" y="418" font-size="9" fill="#e4e4e7" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif">One physical filament is assigned to each horizontal layer.</text>
<text x="700" y="435" font-size="9" fill="#e4e4e7" text-anchor="middle" font-family="Inter,ui-sans-serif,sans-serif">No arbitrary color combinations are fabricated.</text>

